<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX 真实行情 · 模拟资金</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/real.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">FX <span>真实盘</span></div>
    <p id="marketTicker" class="ticker">行情加载中…</p>

    <dl id="realAcct" class="acct"></dl>

    <div class="topbar-actions">
      <a class="btn btn-ghost btn-sm" href="/replay">历史回放</a>
      <a class="btn btn-ghost btn-sm" href="/">← 模拟盘</a>
      <button id="realResetBtn" class="btn btn-ghost btn-sm" type="button">重置账户</button>
      <button id="realLogoutBtn" class="btn btn-ghost btn-sm" type="button">退出</button>
    </div>
  </header>

  <main class="layout real-layout">

    <div id="realBanner" class="real-banner">
      <span id="marketDot" class="market-dot"></span>
      <strong id="marketText">行情加载中…</strong>
      <span id="marketSource" class="dim small"></span>
      <span class="spacer"></span>
      <span class="real-tag">真实行情 · 模拟资金</span>
    </div>

    <div id="realRiskBar" class="risk-bar" hidden>
      <span id="realRiskText"></span>
    </div>

    <section class="grid-main">
      <div class="panel">
        <div class="panel-head">
          <h2>行情</h2>
          <span id="realPairName" class="dim small">USD/JPY</span>
        </div>

        <div id="realPairs" class="pairs"></div>

        <div class="chart-wrap real-chart-wrap">
          <canvas id="realChart"></canvas>
        </div>

        <dl id="realQuote" class="quote"></dl>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>下单</h2>
          <span id="realOrderPair" class="dim small">USD/JPY</span>
        </div>

        <form id="realOrderForm" class="form" novalidate>
          <div class="field">
            <label>杠杆倍数</label>
            <div id="realLeverageChips" class="chip-row"></div>
          </div>

          <div class="field">
            <label for="realAmount">投入金额（保证金）</label>
            <input id="realAmount" type="number" value="10000"
                   step="1000" min="1000" inputmode="decimal">
          </div>

          <div id="realAmountChips" class="chip-row">
            <button type="button" data-real-amount="10000">¥1 万</button>
            <button type="button" data-real-amount="30000">¥3 万</button>
            <button type="button" data-real-amount="50000">¥5 万</button>
            <button type="button" data-real-amount="100000">¥10 万</button>
            <button type="button" data-real-amount="300000">¥30 万</button>
          </div>

          <p id="realMarginHint" class="hint"></p>
          <p id="realLeverageHint" class="hint"></p>
          <p id="realAccountNote" class="hint hint-warn" hidden></p>

          <div class="trade-actions">
            <button id="realLongBtn" class="btn btn-buy" type="button">做多</button>
            <button id="realShortBtn" class="btn btn-sell" type="button">做空</button>
          </div>

          <p class="hint">
            真实行情、模拟资金，不涉及真实资金，也不构成投资建议。<br>
            数据来源：Swissquote 公共行情，Frankfurter 日线回退，Yahoo Finance 历史；周末或网络异常时可能停盘/延迟。
          </p>
        </form>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>真实盘持仓</h2>
        <span class="dim small">按最新真实报价计算浮盈亏</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>货币对</th>
              <th>方向</th>
              <th>投入</th>
              <th>杠杆</th>
              <th>名义价值</th>
              <th>开仓价</th>
              <th>现价</th>
              <th>浮动盈亏</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="realPositionsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>真实盘成交</h2>
        <span id="realTradeMeta" class="dim small"></span>
      </div>

      <div id="realStats" class="stat-grid"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>货币对</th>
              <th>方向</th>
              <th>投入</th>
              <th>杠杆</th>
              <th>开仓价</th>
              <th>平仓价</th>
              <th>盈亏</th>
              <th>结算</th>
            </tr>
          </thead>
          <tbody id="realTradesBody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <div id="realToasts" class="toasts" aria-live="polite"></div>

  <script src="/static/sound.js" defer></script>
  <script src="/static/real.js" defer></script>
</body>
</html>
